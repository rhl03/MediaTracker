import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * App version: package.json is the single source of truth.
 * versionName is the version string as-is (e.g. "1.2.3").
 * versionCode is derived as major * 10000 + minor * 100 + patch,
 * so every newer version always gets a larger number.
 */
def packageJson = new JsonSlurper().parse(file("../../package.json"))
def appVersionName = packageJson.version as String
def appVersionParts = appVersionName.split("-")[0].tokenize(".").collect { it as int }
if (appVersionParts.size() != 3) {
    throw new GradleException("package.json version must be major.minor.patch, got: ${appVersionName}")
}
if (appVersionParts[1] > 99 || appVersionParts[2] > 99) {
    throw new GradleException("minor and patch must be below 100 for versionCode, got: ${appVersionName}")
}
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mediatracker"
    defaultConfig {
        applicationId "com.mediatracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Values come from ~/.gradle/gradle.properties, never from the repo.
            if (project.hasProperty('MEDIATRACKER_STORE_FILE')) {
                storeFile file(MEDIATRACKER_STORE_FILE)
                storePassword MEDIATRACKER_STORE_PASSWORD
                keyAlias MEDIATRACKER_KEY_ALIAS
                keyPassword MEDIATRACKER_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
